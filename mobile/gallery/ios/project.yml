# The gallery's iOS host. `xcodegen generate --spec project.yml` writes ElyGallery.xcodeproj;
# build the Rust library first, in mobile/gallery: `cargo build --lib --target aarch64-apple-ios-sim`
# (or `aarch64-apple-ios`, with `--release` for the Release configuration).
name: ElyGallery
options:
  bundleIdPrefix: com.elygpui
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

targets:
  ElyGallery:
    type: application
    platform: iOS
    sources:
      - path: main.m
        type: file
        buildPhase: sources
      - path: gpui_ios.h
        type: file
        buildPhase: headers
      - path: LaunchScreen.storyboard
        type: file
        buildPhase: resources
      - path: Assets.xcassets
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elygpui.gallery
        PRODUCT_NAME: ElyGallery
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGN_STYLE: Automatic
        CLANG_ENABLE_MODULES: YES
        CLANG_ENABLE_OBJC_ARC: YES
        ENABLE_BITCODE: NO
        # The Rust library links statically; Xcode's debug dylib loader fails with it on devices.
        ENABLE_DEBUG_DYLIB: NO
        DEAD_CODE_STRIPPING: NO
        # The .a by its path, so the linker never takes a .dylib beside it.
        OTHER_LDFLAGS:
          - "-force_load"
          - "$(GALLERY_STATIC_LIB)"
          - "-lc++"
          - "-framework UIKit"
          - "-framework Metal"
          - "-framework MetalKit"
          - "-framework QuartzCore"
          - "-framework CoreGraphics"
          - "-framework CoreText"
          - "-framework CoreFoundation"
          - "-framework Foundation"
          - "-framework Security"
          - "-framework SystemConfiguration"
          - "-framework AudioToolbox"
          - "-framework WebKit"
          - "-framework CoreMedia"
          - "-framework AVFoundation"
          - "-framework LocalAuthentication"
          - "-framework Contacts"
          - "-framework EventKit"
          - "-framework StoreKit"
          - "-framework CoreMotion"
          - "-ObjC"
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)"
        VALID_ARCHS: "arm64"
        ARCHS: "arm64"
        ONLY_ACTIVE_ARCH: YES
        "GALLERY_STATIC_LIB[sdk=iphonesimulator*]": "$(PROJECT_DIR)/../target/aarch64-apple-ios-sim/debug/libely_gallery_mobile.a"
        "GALLERY_STATIC_LIB[sdk=iphoneos*]": "$(PROJECT_DIR)/../target/aarch64-apple-ios/debug/libely_gallery_mobile.a"
      configs:
        Debug:
          GCC_OPTIMIZATION_LEVEL: "0"
        Release:
          "GALLERY_STATIC_LIB[sdk=iphonesimulator*]": "$(PROJECT_DIR)/../target/aarch64-apple-ios-sim/release/libely_gallery_mobile.a"
          "GALLERY_STATIC_LIB[sdk=iphoneos*]": "$(PROJECT_DIR)/../target/aarch64-apple-ios/release/libely_gallery_mobile.a"
          GCC_OPTIMIZATION_LEVEL: "s"
