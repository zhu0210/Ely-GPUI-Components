name: Mobile gallery

# Builds the gallery's Android host, opens pages on an emulator, light and dark, and uploads a
# screenshot of each. Look at them: a page that does not crash can still draw wrong.

on:
  push:
    branches: [mobile]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  android-emulator:
    name: Android emulator (API 34)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/gallery

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # API 30 images have no Vulkan, and gpui-pre-wgpu cannot render on GLES 3.0.
      - name: Build the x86_64 library
        working-directory: mobile/gallery
        run: |
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" cargo ndk -t x86_64 -P 26 -o android/app/src/main/jniLibs build --release
          rm -f android/app/src/main/jniLibs/*/libgpui_mobile-*.so

      - name: Assemble the APK
        working-directory: mobile/gallery/android
        run: ./gradlew assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open pages on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/gallery-smoke.sh

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gallery-android-smoke
          path: smoke/
          retention-days: 14
