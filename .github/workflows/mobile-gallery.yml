name: Mobile gallery

# Builds the gallery's Android host, opens pages on an emulator, light and dark, and uploads a
# screenshot of each. Look at them: a page that does not crash can still draw wrong.

on:
  push:
    branches: [mobile]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  android-emulator:
    name: Android emulator (API 34)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/gallery

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # API 30 images have no Vulkan, and gpui-pre-wgpu cannot render on GLES 3.0.
      - name: Build the x86_64 library
        working-directory: mobile/gallery
        run: |
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" cargo ndk -t x86_64 -P 26 -o android/app/src/main/jniLibs build --release
          rm -f android/app/src/main/jniLibs/*/libgpui_mobile-*.so

      - name: Assemble the APK
        working-directory: mobile/gallery/android
        run: ./gradlew assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open pages on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/gallery-smoke.sh

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gallery-android-smoke
          path: smoke/
          retention-days: 14

  ios-simulator:
    name: iOS simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/gallery

      - name: Build the Rust library
        working-directory: mobile/gallery
        run: cargo build --lib --target aarch64-apple-ios-sim

      - name: Build for the simulator
        working-directory: mobile/gallery/ios
        run: |
          brew install xcodegen && xcodegen generate --spec project.yml
          xcodebuild -project ElyGallery.xcodeproj -scheme ElyGallery \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGNING_ALLOWED=NO build

      - name: Open pages on the simulator
        run: bash .github/scripts/gallery-smoke-ios.sh

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gallery-ios-smoke
          path: smoke/
          retention-days: 14

  ios-ipa:
    name: iOS unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/gallery

      - name: Build the Rust library
        working-directory: mobile/gallery
        run: cargo build --lib --target aarch64-apple-ios --release

      - name: Build for devices, unsigned
        working-directory: mobile/gallery/ios
        run: |
          brew install xcodegen && xcodegen generate --spec project.yml
          xcodebuild -project ElyGallery.xcodeproj -scheme ElyGallery \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      # SideStore signs it on the device.
      - name: Package the IPA
        run: |
          mkdir -p ipa/Payload
          cp -R mobile/gallery/ios/build/Build/Products/Release-iphoneos/ElyGallery.app ipa/Payload/
          (cd ipa && zip -qr ElyGallery-unsigned.ipa Payload)

      - uses: actions/upload-artifact@v7
        with:
          name: ElyGallery-unsigned.ipa
          path: ipa/ElyGallery-unsigned.ipa
          retention-days: 14
